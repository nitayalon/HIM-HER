[project]
name = "himher"
version = "0.1.0"
description = "Code for the HIM+HER framework (resource-rational social world model adaptation)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["himher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
